[project]
name = "evidentia-workspace"
version = "0.1.0"
description = "Governed Python workspace for Evidentia"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "import-linter>=2.7,<3",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "sdks/python"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["backend/src", "sdks/python/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["evidentia", "evidentia_sdk"]
mypy_path = ["backend/src", "sdks/python/src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
pythonpath = ["."]
testpaths = ["backend/tests", "sdks/python/tests", "tests/architecture"]

[tool.importlinter]
root_packages = ["evidentia"]
include_external_packages = false

[[tool.importlinter.contracts]]
id = "contexts-do-not-import-entrypoints"
name = "Bounded contexts do not import API or worker entrypoints"
type = "forbidden"
source_modules = ["evidentia.modules"]
forbidden_modules = ["evidentia.entrypoints"]

[[tool.importlinter.contracts]]
id = "context-dependencies-are-acyclic"
name = "Bounded-context dependencies are acyclic"
type = "acyclic_siblings"
ancestors = ["evidentia.modules"]
depth = 1
