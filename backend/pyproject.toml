[project]
name = "evidentia-backend"
version = "0.1.0"
description = "Evidentia API, worker, and bounded-context packages"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.119,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn>=0.37,<1",
  "python-multipart>=0.0.20,<1",
]

[project.scripts]
evidentia-api = "evidentia.entrypoints.api.main:main"
evidentia-identity-init = "evidentia.entrypoints.cli.identity:main"
evidentia-worker = "evidentia.entrypoints.worker.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidentia"]
