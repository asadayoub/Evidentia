# @skyhook-implements REQ-014
# @skyhook-implements NFR-004
# @skyhook-implements NFR-006
# @skyhook-implements CON-005
# @skyhook-story STORY-009

name: evidentia

x-backend-environment: &backend-environment
  EVIDENTIA_ENVIRONMENT: development
  EVIDENTIA_VERSION: 0.1.0
  EVIDENTIA_DATABASE__HOST: database
  EVIDENTIA_DATABASE__PORT: 5432
  EVIDENTIA_DATABASE__NAME: evidentia
  EVIDENTIA_DATABASE__USER: evidentia
  EVIDENTIA_DATABASE__PASSWORD: ${POSTGRES_PASSWORD:?Generate a local secret before starting Evidentia}
  EVIDENTIA_LOGGING__LEVEL: INFO
  EVIDENTIA_LOGGING__JSON: "true"
  EVIDENTIA_STORAGE__BACKEND: filesystem
  EVIDENTIA_STORAGE__ROOT: /var/lib/evidentia/artifacts

x-application-security: &application-security
  read_only: true
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=64m,mode=1777
  networks:
    - runtime

services:
  database:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    restart: unless-stopped
    environment:
      POSTGRES_DB: evidentia
      POSTGRES_USER: evidentia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a local secret before starting Evidentia}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=evidentia --username=evidentia"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - runtime

  storage-init:
    build:
      context: ../..
      dockerfile: infra/containers/backend.Dockerfile
      target: runtime
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown -R 10001:10001 /var/lib/evidentia/artifacts"]
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    volumes:
      - artifact-data:/var/lib/evidentia/artifacts
    networks:
      - runtime

  api:
    <<: *application-security
    build:
      context: ../..
      dockerfile: infra/containers/backend.Dockerfile
      target: api
    environment:
      <<: *backend-environment
      EVIDENTIA_API__HOST: 0.0.0.0
      EVIDENTIA_API__PORT: 8000
      EVIDENTIA_API__RELOAD: "false"
    depends_on:
      database:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - artifact-data:/var/lib/evidentia/artifacts

  worker:
    <<: *application-security
    build:
      context: ../..
      dockerfile: infra/containers/backend.Dockerfile
      target: worker
    environment:
      <<: *backend-environment
      EVIDENTIA_WORKER__SHUTDOWN_GRACE_SECONDS: 30
    depends_on:
      database:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - artifact-data:/var/lib/evidentia/artifacts

  web:
    <<: *application-security
    build:
      context: ../..
      dockerfile: infra/containers/web.Dockerfile
      target: runtime
    depends_on:
      api:
        condition: service_healthy

networks:
  runtime:
    internal: true

volumes:
  artifact-data:
  postgres-data:
