project-name: Evidentia
project-description: An open-source, self-hostable platform that converts documents into inspectable, correctable, validated, authorized, and traceable business records.
target-users: Initially, small accounting and operations teams processing recurring supplier invoices, supported by internal developers or automation agencies; later, broader document-heavy teams and integrating developers.
core-value: Turn source documents into trustworthy business records by preserving field-level evidence, uncertainty, corrections, immutable revisions, authorization binding, and delivery history.
auth-strategy: Local authenticated operation by default, with optional standards-based OIDC integration for external identity providers.
database-choice: PostgreSQL
deployment-target: Docker Compose-first self-hosted deployment, portable to VPS or Kubernetes-style environments.
api-style: Versioned REST APIs documented with OpenAPI and used to generate supported clients.
design-direction: Enterprise/professional, restrained, information-dense, accessibility-first, and optimized for repeated document-review work rather than marketing-style visual effects.
component-library: Custom application components built with Radix UI accessibility primitives and Tailwind CSS design tokens.
