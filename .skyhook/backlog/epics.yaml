    updatedAt: "2026-10-01T16:48:07.988Z"
  - id: STORY-003
    title: Build governed schema discovery and evolution workflow
    description: Implements REQ-017 by turning unfamiliar fields and structures into reviewable schema suggestions rather than silently changing authoritative records.
    epicId: 0QDXE9R7PY4N4E743SZ1NHH6Z4
    status: backlog
    storyPoints: 1
    priority: high
    standards: []
    relatedRequirements: []
    acceptanceCriteria:
      - Unexpected provider fields are retained as raw output or explicit unmapped candidates and never silently inserted into authoritative records.
      - Suggestions retain their document, provider, evidence, type inference, and occurrence context.
      - Authorized users can accept, rename, type, constrain, group, reject, and document suggested fields in a draft schema.
      - Draft schemas can be evaluated against representative documents and compared with the current published version.
      - Publishing creates a new immutable schema version and does not reinterpret existing extraction runs or record revisions.
      - Schema discovery and publication actions are permission-controlled and auditable.
    dependsOn:
      - 4PJTJVE73D2MN7GT64T48S05HT
      - STORY-002
    createdAt: "2026-10-01T16:50:46.326Z"
    updatedAt: "2026-10-01T16:50:46.326Z"
  - id: STORY-004
