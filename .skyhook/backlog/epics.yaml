  - id: STORY-002
    title: Implement contextual schema resolution and composition
    description: Implements REQ-016 and the schema-driven record ADR. Resolve dynamic record structures from document classification and governed operating context without embedding document-specific fields in core models.
    epicId: 0QDXE9R7PY4N4E743SZ1NHH6Z4
    status: backlog
    storyPoints: 1
    priority: critical
    standards: []
    relatedRequirements: []
    acceptanceCriteria:
      - Resolution inputs can include document class, tenant, workflow, jurisdiction, destination, and versioned external references.
      - Precedence and composition rules are deterministic, validated, and explainable.
      - Every extraction run and record revision stores the resolved schema identifier, version, resolution inputs, and relevant context versions.
      - Later configuration or external-data changes cannot reinterpret an existing run or revision.
      - Adding a schema pack or resolver input does not require changing core document, record, review, approval, or delivery aggregates.
    dependsOn:
      - 4PJTJVE73D2MN7GT64T48S05HT
      - C37NZW5X9ASZRS7XHZ7W56MG8V
