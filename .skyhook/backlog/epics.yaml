  - id: STORY-011
    title: Implement trusted identity, tenant context, and authorization hooks
    description: Implements NFR-002, CON-004, and CON-005. Provide local authentication for standalone operation and an OIDC adapter boundary without making an external identity provider mandatory.
    epicId: CG7VFRWAF177CMZK333E19YND1
    status: backlog
    storyPoints: 8
    priority: critical
    standards:
      - STD-ARCH-001
      - STD-ARCH-002
      - STD-DEV-001
    relatedRequirements:
      - NFR-002
      - CON-004
      - CON-005
    acceptanceCriteria:
      - Local authentication supports secure password hashing, session or token invalidation, bootstrap administration, and rate-limit hooks without default shared credentials.
      - An OIDC validation adapter maps verified issuer, audience, subject, and claims into the same internal principal contract.
      - Tenant context is derived from authenticated membership or trusted worker context and never solely from a request body, query, or unverified header.
      - Application authorization hooks evaluate principal, tenant, action, and resource context and deny by default.
      - Worker context has an authenticated system identity, initiating actor where applicable, tenant scope, and correlation/causation identifiers.
      - Security tests cover tenant spoofing, disabled membership, invalid tokens, missing context, and sensitive-log redaction.
    dependsOn:
      - STORY-010
