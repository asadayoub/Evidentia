severity: error
version: 1.0.0
summary: Governs Evidentia repository placement, deployable boundaries, public contracts, and generated artifacts.
guidelines:
  - Place backend code in its owning bounded-context package and expose cross-module use only through declared public application surfaces.
  - Keep API and worker entry points thin, independently runnable, and dependent on shared bounded-context packages rather than duplicated business logic.
  - Keep frontend, SDK, contract, test, fixture, infrastructure, CI, and documentation artifacts in their documented repository areas.
  - Generate SDKs only from checked versioned public contracts, not private backend persistence or domain models.
  - Mark generated files with source and generator metadata, reproduce them in CI, and never hand-edit them.
  - Keep sensitive or unpermissioned documents out of the repository and require provenance manifests for evaluation fixtures.
  - Keep provider-specific CI configuration thin by placing validation logic in provider-neutral repository scripts.
  - Do not add Delibera domain, persistence, or migration code to the Evidentia repository.
acceptanceCriteria:
  - Every production file has clear ownership under the accepted repository and bounded-context maps.
  - API, worker, and web artifacts can be built and run independently from one checkout.
  - Contract changes trigger compatibility checks, SDK regeneration, conformance tests, and release-note updates.
  - CI fails when checked generated artifacts do not reproduce or were edited manually.
  - Architecture tests reject forbidden backend imports and cross-module persistence access.
  - Fixture manifests establish permission and provenance for committed evaluation material.
  - No Evidentia build or test requires Delibera private source code or database access.
remediation: Move the artifact to its documented owner, replace private-model coupling with a checked public contract, regenerate outputs from their recorded source, and add the missing repository or architecture check.
