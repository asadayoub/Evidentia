schemaVersion: 1.0.0
id: STD-ARCH-003
title: Deterministic authorization snapshot and hash integrity
category: security
domain: security
tags:
  - canonicalization
  - authorization
  - hashing
  - jcs
  - sha-256
  - idempotency
severity: critical
version: 1.0.0
summary: Requires deterministic versioned authorization snapshots that bind exact record content and operation scope across implementations.
guidelines:
  - Build snapshots only from persisted immutable revisions, published schemas, and persisted action and destination scope.
  - Canonicalize snapshot payloads with the recorded contract version and RFC 8785 JCS implementation; never hash ordinary serializer output.
  - Encode money and arbitrary-precision decimals as canonical strings and reject binary floating-point business values.
  - Persist the exact payload, canonical representation, algorithm identifiers, and digest before external submission.
  - Select material content from published schema and authorization-policy versions rather than hard-coded document fields.
  - Reuse the exact stored payload, digest, and idempotency key for submission retries.
  - Require a new revision and approval submission for every material-content or authorization-scope change.
  - Verify digest, tenant, revision, action, destination, authenticated decision provenance, and lifecycle authority before delivery.
  - Maintain shared Python and TypeScript conformance fixtures including malformed and adversarial cases.
acceptanceCriteria:
  - Python and TypeScript produce identical canonical bytes and digest values for every conformance fixture.
  - Tests distinguish missing fields from null, ordered arrays from reordered arrays, and canonical decimals from invalid encodings.
  - Changing any material value, action, destination, mapping version, schema version, or revision identity changes the payload digest as specified.
  - Retry tests prove a lost submission response recovers the original external request without rebuilding the snapshot.
  - Existing snapshots continue to verify under their recorded versions after canonicalization or schema upgrades.
  - Delivery rejects mismatched, expired, cancelled, revoked, superseded, unverified, or unauthorized snapshots.
remediation: Rebuild the snapshot from immutable versioned inputs using the shared contract implementation, preserve the exact canonical payload and algorithm metadata, invalidate any mismatched authorization, and add a cross-language conformance fixture for the failure.
